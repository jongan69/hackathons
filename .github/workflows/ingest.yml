name: Ingest hackathons

# Refreshes public/events.json on dev. A reviewed dev-to-main PR promotes the
# new feed to production after CI passes.
#
# Cost: $0. GitHub Actions is free for public repos, and this runs well inside
# the free minutes for private ones (~4 runs/day at well under a minute each).

on:
  schedule:
    # 06:00, 12:00, 18:00 and 00:00 UTC -- deadlines matter, staleness is the
    # main failure mode of every other hackathon directory.
    - cron: '0 0,6,12,18 * * *'
  workflow_dispatch: # allow manual runs from the Actions tab

permissions:
  contents: write

concurrency:
  group: ingest
  cancel-in-progress: false

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: dev

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.14

      # Parsers are gated first: never publish data produced by broken logic.
      - name: Test parsers
        run: bun run test:parse

      - name: Fetch and normalize
        run: bun run ingest

      - name: Validate output
        run: bun run validate

      - name: Commit if changed
        run: |
          if git diff --quiet -- public/events.json; then
            echo "No change in event data."
            exit 0
          fi

          COUNT=$(node -p "require('./public/events.json').count")
          git config user.name  "hackathon-ingest[bot]"
          git config user.email "actions@github.com"
          git add public/events.json
          git commit -m "data: refresh feed (${COUNT} events)"
          git push
